name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch: {}

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Build guava jar
        run: mvn -B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn package -U -DskipTests=true -Dmaven.javadoc.skip=true -pl guava -am -f pom.xml
      - uses: actions/upload-artifact@v4
        with:
          name: guava-jar
          path: guava/target/guava-30.0-jre.jar
          if-no-files-found: error
